<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Professional Kanban Board</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
:root {
  --bg: #f5f7fa;
  --card: #ffffff;
  --border: #dcdfe6;
  --text: #2c3e50;
  --muted: #7f8c8d;
  --primary: #4a6cf7;
  --danger: #e74c3c;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
}

header {
  padding: 16px 24px;
  background: #fff;
  border-bottom: 1px solid var(--border);
  font-size: 20px;
  font-weight: 600;
}

.board {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  padding: 16px;
  height: calc(100vh - 70px);
}

.column {
  background: #eef1f7;
  border-radius: 8px;
  padding: 12px;
  display: flex;
  flex-direction: column;
}

.column-header {
  font-weight: 600;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
}

.cards {
  flex: 1;
  overflow-y: auto;
}

.card {
  background: var(--card);
  border-radius: 6px;
  padding: 10px;
  margin-bottom: 8px;
  cursor: grab;
  border-left: 4px solid var(--primary);
}

.card.low { border-color: #2ecc71; }
.card.medium { border-color: #f1c40f; }
.card.high { border-color: #e74c3c; }

.card-title {
  font-weight: 600;
  margin-bottom: 4px;
}

.card-meta {
  font-size: 12px;
  color: var(--muted);
}

.card-actions {
  margin-top: 6px;
  display: flex;
  gap: 8px;
}

button {
  border: none;
  padding: 4px 8px;
  font-size: 12px;
  border-radius: 4px;
  cursor: pointer;
}

button.primary { background: var(--primary); color: white; }
button.danger { background: var(--danger); color: white; }

.add-card {
  margin-top: 8px;
  font-size: 13px;
  background: transparent;
  color: var(--primary);
  cursor: pointer;
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  display: none;
  align-items: center;
  justify-content: center;
}

.modal-content {
  background: #fff;
  width: 400px;
  border-radius: 8px;
  padding: 16px;
}

.modal-content input,
.modal-content select,
.modal-content textarea {
  width: 100%;
  margin-bottom: 10px;
  padding: 8px;
}
</style>
</head>

<body>

<header>BugHerd-Style Professional Kanban</header>

<div class="board" id="board"></div>

<!-- Modal -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3>Task</h3>
    <input id="title" placeholder="Title" />
    <input id="assignee" placeholder="Assignee" />
    <select id="priority">
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
    </select>
    <textarea id="comments" placeholder="Comments / feedback"></textarea>
    <button class="primary" onclick="saveCard()">Save</button>
  </div>
</div>

<script>
const columns = ["Backlog", "In Progress", "Review", "Done"];
let state = JSON.parse(localStorage.getItem("kanban")) || {};
let currentColumn = null;
let editingCard = null;

function saveState() {
  localStorage.setItem("kanban", JSON.stringify(state));
}

function init() {
  const board = document.getElementById("board");
  board.innerHTML = "";

  columns.forEach(col => {
    if (!state[col]) state[col] = [];

    const el = document.createElement("div");
    el.className = "column";
    el.innerHTML = `
      <div class="column-header">
        ${col}
        <span>${state[col].length}</span>
      </div>
      <div class="cards" ondrop="drop(event,'${col}')" ondragover="allowDrop(event)">
        ${state[col].map((c,i)=>cardTemplate(c,col,i)).join("")}
      </div>
      <button class="add-card" onclick="openModal('${col}')">+ Add</button>
    `;
    board.appendChild(el);
  });
}

function cardTemplate(c,col,i) {
  return `
  <div class="card ${c.priority}" draggable="true"
       ondragstart="drag(event,'${col}',${i})">
    <div class="card-title">${c.title}</div>
    <div class="card-meta">${c.assignee || "Unassigned"}</div>
    <div class="card-actions">
      <button onclick="editCard('${col}',${i})">Edit</button>
      <button class="danger" onclick="deleteCard('${col}',${i})">Delete</button>
    </div>
  </div>`;
}

let dragged;

function drag(e,col,i) {
  dragged = { col, i };
}

function allowDrop(e) { e.preventDefault(); }

function drop(e,targetCol) {
  const item = state[dragged.col].splice(dragged.i,1)[0];
  state[targetCol].push(item);
  saveState();
  init();
}

function openModal(col) {
  currentColumn = col;
  editingCard = null;
  document.getElementById("modal").style.display = "flex";
}

function editCard(col,i) {
  const c = state[col][i];
  editingCard = { col, i };
  title.value = c.title;
  assignee.value = c.assignee;
  priority.value = c.priority;
  comments.value = c.comments;
  openModal(col);
}

function saveCard() {
  const data = {
    title: title.value,
    assignee: assignee.value,
    priority: priority.value,
    comments: comments.value
  };

  if (editingCard) {
    state[editingCard.col][editingCard.i] = data;
  } else {
    state[currentColumn].push(data);
  }

  document.getElementById("modal").style.display = "none";
  title.value = assignee.value = comments.value = "";
  saveState();
  init();
}

function deleteCard(col,i) {
  state[col].splice(i,1);
  saveState();
  init();
}

init();
</script>

</body>
</html>
